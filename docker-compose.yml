# docker-compose.yml
# INSaFLU, NVI deployment, branch nvi-install.
# Deploy config lives in .env in this directory: required variables fail the
# file at startup via ${VAR:?} guards.
# Profiles: default (no profile) builds insaflu-server from source, the NVI
# deployment path. --profile upstream runs the prebuilt insapathogenomics
# 2.2.2 server image on the same volumes. --profile windows runs the 2.2.1
# image that upstream shipped for Docker Desktop. Run exactly one variant at
# a time: the three server services share the container port and IP.
# televir-server builds from source in all variants, as upstream also does.
# The init service creates the host directories under BASE_PATH_DATA that
# the named volumes bind to: the local driver does not create missing paths.
# restart: no everywhere by policy: if it fails, it dies, we fix.
# The hourly deck-chores job updates pangolin DATA only: the tool stays at
# the image's pinned version. Full update stays manual: manage.py update_pangolin.
# fork: github.com/georgemarselis-nvi/insaflu-docker

### places where the most important data is
volumes:

  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/postgres/postgres_data
  pgbackups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/postgres/backups
  insaflu-server-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/insaflu/data/all_data
  insaflu-server-predefined_dbs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/insaflu/data/predefined_dbs
  insaflu-server-env:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/insaflu/env
  insaflu-server-log-insaflu:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/insaflu/log/insaFlu
  insaflu-server-log-httpd:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/insaflu/log/httpd
  televir:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BASE_PATH_DATA}/televir/
### this is necessary to set an ip to SGE in insaflu
networks:
  insaflu_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.1.0.0/24

services:
  # creates the host directories the named volumes bind to, then exits.
  # flu_user is uid 1000 in the insaflu-server image, its log dir is chowned
  # to match. httpd opens its logs as root, root-owned is correct there.
  init:
    image: busybox:1.37
    container_name: insaflu-init
    restart: "no"
    volumes:
      - ${BASE_PATH_DATA}:/data
    command: >
      sh -c "
      mkdir -p /data/postgres/postgres_data
      /data/postgres/backups
      /data/insaflu/data/all_data
      /data/insaflu/data/predefined_dbs
      /data/insaflu/env
      /data/insaflu/log/insaFlu
      /data/insaflu/log/httpd
      /data/televir
      && chown 1000:1000 /data/insaflu/log/insaFlu
      "

  # DB for Insaflu
  # test database - psql -U flu_user -W -h localhost -d insaflu_db
  db_insaflu:
    build: components/postgres_postgis/.
    restart: "no"
    container_name: postgres
    hostname: db_insaflu
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "flu_user"
      POSTGRES_PASSWORD: "flu_user_pass"
      POSTGRES_DB: "insaflu_db"
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - 5432
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.2

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: "no"
    container_name: postgres_backup
    hostname: insaflu_backup
    volumes:
      - pgbackups:/backups
    depends_on:
      init:
        condition: service_completed_successfully
      db_insaflu:
        condition: service_started
    environment:
      POSTGRES_HOST: "insaflu_db"
      POSTGRES_DB: "insaflu_db"
      POSTGRES_USER: "flu_user"
      POSTGRES_PASSWORD: "flu_user_pass"
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 80
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.3

  # responsible to m
  officer:
    image: funkyfuture/deck-chores:1
    restart: "no"
    environment:
      TIMEZONE: "${TIMEZONE}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      
  # TELEVIR
  televir-server:
    build: components/televir/.
    container_name: televir-server
    image: ${USERNAME_IMAGE}:${TELEVIR_IMAGE}
    hostname: televir
    restart: "no"
    volumes:
      - televir:/televir/mngs_benchmark
    depends_on:
      init:
        condition: service_completed_successfully
      pgbackups:
        condition: service_started
      officer:
        condition: service_started
    environment:
      - SGE_ROOT=/opt/sge
    tty: true
    stdin_open: true
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.5
    command: [ "move" ]
    
  # insaflu, built from source: the NVI deployment path
  # password and database login are defined in components/insaflu/configs/insaflu.env 
  insaflu-server:
    build: components/insaflu-server/.
    container_name: insaflu-server
    image: ${USERNAME_IMAGE}:${IMAGE}
    hostname: insaflu
    restart: "no"
    volumes:
      - televir:/televir/mngs_benchmark    
      - insaflu-server-data:/insaflu_web/INSaFLU/media
      - insaflu-server-predefined_dbs:/insaflu_web/INSaFLU/static_all/db
      - insaflu-server-env:/insaflu_web/INSaFLU/env
      - insaflu-server-log-insaflu:/var/log/insaFlu
      - insaflu-server-log-httpd:/var/log/httpd
    labels:
      deck-chores.update-pangolin-data.command: sh -c "/software/update_pangolin_data.sh"
      # weekly, daily, hourly, every minute and every second.
      deck-chores.update-pangolin-data.interval: hourly
    depends_on:
      init:
        condition: service_completed_successfully
      db_insaflu:
        condition: service_started
      pgbackups:
        condition: service_started
      officer:
        condition: service_started
    environment:
      - SGE_ROOT=/opt/sge
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is not set in .env}
    ports:
      - "${APP_PORT}:80"
    tty: true
    stdin_open: true
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.4
    command: [ "init_all" ]

  # insaflu, upstream prebuilt image on the same volumes
  insaflu-server-upstream:
    profiles: ["upstream"]
    image: insapathogenomics/insaflu-server:2.2.2
    container_name: insaflu-server-upstream
    hostname: insaflu
    restart: "no"
    volumes:
      - televir:/televir/mngs_benchmark    
      - insaflu-server-data:/insaflu_web/INSaFLU/media
      - insaflu-server-predefined_dbs:/insaflu_web/INSaFLU/static_all/db
      - insaflu-server-env:/insaflu_web/INSaFLU/env
      - insaflu-server-log-insaflu:/var/log/insaFlu
      - insaflu-server-log-httpd:/var/log/httpd
    labels:
      deck-chores.update-pangolin-data.command: sh -c "/software/update_pangolin.sh"
      # weekly, daily, hourly, every minute and every second.
      deck-chores.update-pangolin-data.interval: hourly
    depends_on:
      init:
        condition: service_completed_successfully
      db_insaflu:
        condition: service_started
      pgbackups:
        condition: service_started
      officer:
        condition: service_started
    environment:
      - SGE_ROOT=/opt/sge
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is not set in .env}
    ports:
      - "${APP_PORT}:80"
    tty: true
    stdin_open: true
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.4
    command: [ "init_all" ]

  # insaflu, the 2.2.1 image upstream shipped for Docker Desktop
  insaflu-server-windows:
    profiles: ["windows"]
    image: insapathogenomics/insaflu-server:2.2.1
    container_name: insaflu-server-windows
    hostname: insaflu
    restart: "no"
    volumes:
      - televir:/televir/mngs_benchmark    
      - insaflu-server-data:/insaflu_web/INSaFLU/media
      - insaflu-server-predefined_dbs:/insaflu_web/INSaFLU/static_all/db
      - insaflu-server-env:/insaflu_web/INSaFLU/env
      - insaflu-server-log-insaflu:/var/log/insaFlu
      - insaflu-server-log-httpd:/var/log/httpd
    labels:
      deck-chores.update-pangolin-data.command: sh -c "/software/update_pangolin.sh"
      # weekly, daily, hourly, every minute and every second.
      deck-chores.update-pangolin-data.interval: hourly
    depends_on:
      init:
        condition: service_completed_successfully
      db_insaflu:
        condition: service_started
      pgbackups:
        condition: service_started
      officer:
        condition: service_started
    environment:
      - SGE_ROOT=/opt/sge
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS is not set in .env}
    ports:
      - "${APP_PORT}:80"
    tty: true
    stdin_open: true
    networks:
      insaflu_net:
        ipv4_address: 10.1.0.4
    command: [ "init_all" ]
